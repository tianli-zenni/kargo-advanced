apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: kargo-advanced
  namespace: argocd
spec:
  clusterResourceWhitelist:
  - group: ""
    kind: Namespace
  destinations:
  - name: '*'
    namespace: kargo-advanced-*
    server: '*'
  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'
  sourceRepos:
  - https://github.com/tianli-zenni/kargo-advanced.git
